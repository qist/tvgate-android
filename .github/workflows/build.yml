name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖 APK 版本号（如 3.11.0），留空则用 tvgate 源码 config/version'
        required: false

# 只上传 workflow artifact，不创建 GitHub Release，无需写权限
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TVGATE_KS_ALIAS: tvgate
    steps:
      - name: Checkout (tvgate-android)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # Node/npm：构建 TVGate Web 前端用（build-android.sh 内置 web-ui 构建）。
      # ubuntu-latest 自带 node，这里显式锁 Node 20，与上游 release.yml 一致。
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-35 ndk;25.2.9519653'

      # 签名密钥：CI 直接把 secret（keystore 的 base64）解码为 release.keystore 文件，
      # 避免超长 base64 经 $GITHUB_ENV 注入时被转义损坏。本地可放文件或靠脚本从
      # TVGATE_KS_BASE64 环境变量生成。
      - name: Restore release keystore from secret
        env:
          TVGATE_KS_BASE64: ${{ secrets.TVGATE_KS_BASE64 }}
        run: |
          if [ -z "$TVGATE_KS_BASE64" ]; then
            echo "ERROR: Secret TVGATE_KS_BASE64 未设置" >&2
            exit 1
          fi
          printf '%s' "$TVGATE_KS_BASE64" | tr -d '\r\n\t ' | base64 -d > release.keystore
          chmod 600 release.keystore
          if [ ! -s release.keystore ]; then
            echo "ERROR: release.keystore 解码后为空，请检查 TVGATE_KS_BASE64" >&2
            exit 1
          fi

      # 若 qist/tvgate 为私有仓库，请改为带凭据的地址，
      # 例如：https://<TOKEN>@github.com/qist/tvgate.git（TOKEN 存于 Secrets）
      - name: Checkout TVGate server source
        run: |
          git clone --depth 1 https://github.com/qist/tvgate.git /tmp/tvgate

      - name: Build split APKs (signed)
        env:
          TVGATE_KS_PASS: ${{ secrets.TVGATE_KS_PASS }}
          TVGATE_SRC: /tmp/tvgate
          TVGATE_VERSION: ${{ inputs.version }}
        run: |
          ./build-android-split.sh

      - name: Read TVGate version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TVGATE_VERSION="${{ inputs.version }}"
          else
            TVGATE_VERSION=$(tr -d '[:space:]' < /tmp/tvgate/config/version)
          fi
          echo "version=$TVGATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "TVGate version: $TVGATE_VERSION"

      # 【测试】构建产物以 workflow artifact 形式供下载（不创建 release / 不上传 releases）
      # 注意：App 在线更新依赖 releases/latest，无 Release 时更新检查将静默跳过
      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvgate-apks-${{ steps.version.outputs.version }}
          path: |
            TVGate-${{ steps.version.outputs.version }}-arm64.apk
            TVGate-${{ steps.version.outputs.version }}-arm.apk
            TVGate-${{ steps.version.outputs.version }}-x86_64.apk
          if-no-files-found: error
