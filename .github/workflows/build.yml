      #       TVGate Android APK ${{ steps.version.outputs.version }}
      #
      #       - arm64-v8a (64位 ARM，主流设备)
      #       - armeabi-v7a (32位 ARM，老设备)
      #       - x86_64 (模拟器 / Chromebox)
