plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tvgate.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.tvgate.app"
        // minSdk 21 = Android 5.0. Go 官方 android target 最低仅支持 API 21，
        // 因此本 App 无法安装到 Android 4.0/4.4 设备（物理限制，非配置问题）。
        minSdk 21
        targetSdk 35
        // 版本号从 TVGate 源码的 config/version 读取（build-android-split.sh 通过
        // 环境变量 TVGATE_VERSION 传入），确保与 tvgate 仓库 tag 一致。
        def tvgateVer = System.getenv('TVGATE_VERSION') ?: '1.0.0'
        versionCode 1
        versionName tvgateVer

        // 内置 TVGate 二进制作为 JNI 库(libtvgate.so)打包进 lib/<abi>/，
        // 运行时从 nativeLibraryDir 直接 exec。Android 15 起禁止从 app 私有数据
        // 目录执行外部二进制，但执行“自己 APK 内的 .so”始终被允许，故此方案
        // 同时兼容 Android 5 ~ 15。
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    // ZXing 二维码生成（仅用 core 模块，不需要相机扫码）
    implementation 'com.google.zxing:core:3.5.3'
}
